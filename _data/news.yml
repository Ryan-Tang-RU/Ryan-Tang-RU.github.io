# News, ported from the Google Sites original. `tag` renders as the bracketed [paper]/[award] label.
- date: 8/2026
  text: I'm happy to serve as guest editor for the <b>Pattern Recognition</b> Special Issue on <a href="https://www.sciencedirect.com/special-issue/336704/world-modeling-for-dynamic-video-understanding">“<b>World Modeling for Dynamic Video Understanding</b>.”</a> Submissions are warmly welcome.
- date: 8/2026
  tag: paper
  text: One paper accepted to <b>EMNLP 2026</b>. We studied proactive safety auditing for multi-turn LLM agents, estimating risk from partial trajectories before unsafe behavior surfaces in the outcome.
- date: 7/2026
  tag: paper
  text: Two papers accepted to <b>COLM 2026</b>. We studied reward hacking in large language models and grounded consistency in video multimodal large language models.
- date: 6/2026
  tag: paper
  text: Three papers accepted to <b>ECCV 2026</b>. We explored personalization, counting mechanisms, and post-hallucination reasoning in large vision-language models.
- date: 6/2026
  text: I am pleased to be invited to give a talk at <b>IBM</b> on <b>agent safety and early failure detection </b><a href="https://drive.google.com/file/d/1AJMKi4lfvNfUNWYMDDl4BszrTcMKb_cY/view?usp=sharing">[Slides Link]</a>.
