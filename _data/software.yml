# Software page. One entry per project, newest first. Keep `summary` to a sentence
# or two; `url` may be a page in this site or an external link. Use `>-` for any
# text containing a colon, which YAML would otherwise read as a mapping key.
#
#  - title: Name
#    url: software/slug/
#    date: 2026
#    status: in development      # optional
#    summary: >-
#      One or two sentences.
heading: Software
description: Tools built in the course of research.
intro: Tools built in the course of research.
# Pages that exist and are linked from a project's text rather than carrying a
# card of their own. They still belong in the sitemap: a page nothing points a
# crawler at is a page that quietly stops existing.
also:
- software/glp1-kg/
projects:
- title: Temporally Evolving T1D Knowledge Graph
  url: software/t1d-kg/
  date: 2026
  status: in development
  summary: >-
    A temporally resolved knowledge graph of the type 1 diabetes literature,
    built from 131,511 PubMed records spanning 1960 to 2026. Every link between
    two entities retains its year by year paper counts, the assertions extracted
    from the text, and the sentences supporting it, so a connection can be dated
    to its first appearance and measured against a corpus baseline rather than
    read as a static fact. The interface provides entity and pair timelines,
    burst detection, shortest paths between entities never studied together, and
    retrieval of the underlying passages. The same pipeline has since been run
    over a second literature, GLP-1, as
    <a href="software/glp1-kg/">a separate graph on its own corpus</a>.
