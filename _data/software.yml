heading: Software
intro: Tools built in the course of research.
projects:
- title: Temporally Evolving T1D Knowledge Graph
  url: software/t1d-kg/
  date: 2026
  status: in development
  summary: >-
    PubMed tells you whether a paper exists; a review tells you today's
    consensus. Neither shows you when a connection entered the field. This
    traces any link in the type 1 diabetes literature from first mention to
    surge, with the papers and the sentences that put it there, and finds routes
    between entities nobody has studied together. 131,511 records, 1960 to 2026.
