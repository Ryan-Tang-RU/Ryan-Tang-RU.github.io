bio:
  - >
    I am a Tenure-Track Assistant Professor in the Department of Computer Science at
    Rutgers University–New Brunswick. I received my Ph.D. in Computer Science from Rice
    University, where I was advised by Dr. <a href="https://cs.rice.edu/~xh37/index.html">Xia Hu</a>.
    I began my undergraduate studies in Biology at Tsinghua University, conducting research
    under the guidance of Dr. <a href="https://scholar.google.com/citations?user=RmC4ZtQAAAAJ&amp;hl=en">Xu Tan</a>,
    and later transferred to the Department of Automation, completing my B.S. under the
    supervision of Dr. <a href="https://scholar.google.com/citations?user=TN8uDQoAAAAJ&amp;hl=en">Jiwen Lu</a>.
  - >
    My group, the <strong>T</strong>rustworthy and <strong>R</strong>eliable
    <strong>AI L</strong>ab (<strong>TRAIL</strong>), works on <strong>Trustworthy AI</strong>,
    with the goal of infusing trust throughout the AI lifecycle. We pursue this goal by
    <strong>formalizing trustworthiness objectives</strong> (e.g., robustness, interpretability,
    and safety) and developing principled algorithms with <strong>measurable guarantees and
    transparent failure modes</strong>. I also collaborate closely with biologists and health
    informaticians to translate trustworthy learning methods to high-impact problems in biology
    and medicine.
  - >
    Large Foundation Models introduce new and complex trustworthiness challenges. Our long-term
    objective is to develop learning algorithms that improve <strong>reasoning reliability</strong>
    under distribution shift and adversarial manipulation, supported by <strong>theoretical
    frameworks that connect representation, optimization, and uncertainty to trust
    outcomes</strong>. By advancing the underlying reasoning mechanisms, we aim to make these
    models more reliable, transparent, and resistant to misuse.

research:
  - title: Operational Interpretability
    body: Turning mechanistic insight into practical tools that monitor, audit, and steer model behavior once deployed.
  - title: Agent Safety &amp; Control
    body: Keeping autonomous and multiagent systems reliable through continuous auditing, early failure prediction, and corrective intervention.
  - title: Perception Reliability
    body: Making multimodal perception systems robust to uncertainty, distribution shift, and adversarial inputs.
  - title: AI for Biomedicine
    body: Translating trustworthy learning into high-impact problems across biology and medicine with clinical and biological collaborators.

