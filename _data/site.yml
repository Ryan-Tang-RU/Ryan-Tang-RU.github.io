bio:
- I am a Tenure-Track Assistant Professor in the Department of Computer Science at Rutgers University–New Brunswick. I received my Ph.D. in Computer Science from Rice University, where I was advised by Dr. <a href="https://cs.rice.edu/~xh37/index.html">Xia Hu</a>. I began my undergraduate studies in Biology at Tsinghua University, conducting research under the guidance of Dr. <a href="https://scholar.google.com/citations?user=RmC4ZtQAAAAJ&amp;hl=en">Xu Tan</a>, and later transferred to the Department of Automation, completing my B.S. under the supervision of Dr. <a href="https://scholar.google.com/citations?user=TN8uDQoAAAAJ&amp;hl=en">Jiwen Lu</a>.
- My group, the <b>T</b>rustworthy and <b>R</b>eliable <b>AI L</b>ab (<b>TRAIL</b>), works on <b>Trustworthy AI</b>, with the goal of infusing trust throughout the AI lifecycle. We pursue this goal by <b>formalizing trustworthiness objectives</b> (e.g., robustness, interpretability, and safety) and developing principled algorithms with <b>measurable guarantees and transparent failure modes</b>. I also collaborate closely with biologists and health informaticians to translate trustworthy learning methods to high-impact problems in biology and medicine.
- Large Foundation Models introduce new and complex trustworthiness challenges. Our long-term objective is to develop learning algorithms that improve <b>reasoning reliability</b> under distribution shift and adversarial manipulation, supported by <b>theoretical frameworks that connect representation, optimization, and uncertainty to trust outcomes</b>. By advancing the underlying reasoning mechanisms, we aim to make these models more reliable, transparent, and resistant to misuse.
research:
- title: Operational Interpretability
  body: Turning mechanistic insight into practical tools that monitor, audit, and steer model behavior once deployed.
- title: Agent Safety & Control
  body: Keeping autonomous and multiagent systems reliable through continuous auditing, early failure prediction, and corrective intervention.
- title: Perception Reliability
  body: Making multimodal perception systems robust to uncertainty, distribution shift, and adversarial inputs.
- title: AI for Biomedicine
  body: Translating trustworthy learning into high-impact problems across biology and medicine with clinical and biological collaborators.
