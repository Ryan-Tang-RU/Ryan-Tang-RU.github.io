  sections:
  - heading: Course Overview
    paras:
    - >-
      CS 439 Spring 2025 introduces foundational concepts and practical techniques in data science, equipping
      students with skills in data manipulation, visualization, and advanced machine learning methods.
      The course covers key topics such as data preprocessing, statistical analysis, regression, classification,
      clustering, recommender systems, and an introduction to deep learning and large language models
      (LLMs). Students will gain hands-on experience with tools like Python, Pandas, Seaborn, and TensorFlow
      through five labs, five quizzes, and two major projects. With a focus on real-world applications,
      this course emphasizes understanding mathematical foundations, dimensionality reduction, anomaly
      detection, and modern AI techniques, preparing students for practical and research-driven careers
      in data science.
  - heading: Grading
    paras:
    - 5 Quizzes
