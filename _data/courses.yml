- slug: fall-2024-trustworthy-ai
  term: Fall 2024
  code: 16:198:598:02
  title: Trustworthy AI Foundations
  heading: 'Fall 2024 AI Topic Course: Trustworthy AI Foundations'
  facts:
  - >-
    Lectures: Wednesday 12:10-1:30 and Friday 2-3:20pm in Richard Weeks Hall on Busch campus room 208
  - 'Instructor: Ruixiang Tang'
  - 'Office Hours: Friday 3-4:00pm, Hill Center room 416'
  sections:
  - heading: Course Overview
    paras:
    - >-
      This graduate topic course aims to give students a broader view of Trustworthy AI and focuses on
      understanding advanced techniques. The course covers key topics such as adversarial attacks and
      defenses, bias detection and mitigation, AI privacy, uncertainty estimation, and interpretable AI.
      Students will engage with the latest research, participate in discussions, and develop skills in
      critically analyzing and presenting complex material.
    - >-
      Prerequisites: This course will assume fundamental knowledge in AI and machine learning (e.g., 01:198:440
      - Introduction to Artificial Intelligence, 16:198:536 - Machine Learning, or equivalent) and mathematical
      maturity (comfortable with linear algebra, probability, or equivalent). Students are expected to
      read and discuss research papers. Please contact the instructor if you have questions regarding
      whether your background is suitable for the course.
  - heading: Grading
    paras:
    - 20% Quizzes
    - 80% Final Project
    - >-
      We will have 5 short quizzes and one final project. The final project can be done individually or
      in groups of no more than 3. Presentations will take place during the last three weeks of the semester,
      followed by a Q&A session.
    - >-
      For the final project, students are required to choose a research paper on trustworthy AI, independently
      replicate its results, and critically analyze it to identify any limitations or potential areas
      for improvement. Students will then propose and develop a solution to address the identified issue
      or introduce a novel idea to enhance the research.
