<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Multi-Agent Framework for Constructing Temporally Evolving T1D Knowledge Graphs</title>
<meta name="description" content="An interactive knowledge graph of the type 1 diabetes literature: 131,511 PubMed records, 26,185 normalised entities, the papers and sentences behind every edge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="description" content="An interactive knowledge graph of the type 1 diabetes literature: 131,511 PubMed records, 26,185 normalised entities, 262,510 extracted relations, and the papers and sentences behind every edge. Queried in the browser.">
<meta property="og:title" content="A Multi-Agent Framework for Constructing Temporally Evolving T1D Knowledge Graphs">
<meta property="og:description" content="An interactive knowledge graph of the type 1 diabetes literature: 131,511 PubMed records, 26,185 normalised entities, 262,510 extracted relations, and the papers and sentences behind every edge. Queried in the browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.ruixiangtang.net/software/t1d-kg/">
<link rel="canonical" href="https://www.ruixiangtang.net/software/t1d-kg/">
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
/* Shown until the query engine is up and the first view has been drawn. The engine
   is a WebAssembly download and the tables are read over range requests, so the
   first seconds are real work rather than a spinner for its own sake. */
.boot{position:fixed;inset:0;z-index:300;display:flex;align-items:center;
  justify-content:center;background:var(--ground);transition:opacity .3s}
.boot.gone{opacity:0;pointer-events:none}
.boot__card{width:min(440px,86vw)}
.boot__t{font:700 15px/1.3 var(--sans);color:var(--navy)}
.boot__s{margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.boot__track{margin-top:14px;height:5px;border-radius:99px;background:var(--hair);
  overflow:hidden}
.boot__fill{height:100%;width:35%;border-radius:99px;background:var(--brand);
  animation:bootslide 1.15s ease-in-out infinite}
@keyframes bootslide{0%{margin-left:-35%}100%{margin-left:100%}}
.boot__n{margin-top:8px;font:400 11px var(--mono);color:var(--ink-3);min-height:15px}
.boot__err{color:#9B3724}
@media (prefers-reduced-motion:reduce){
  .boot__fill{animation:none;width:100%}
  .boot{transition:none}
}
</style>
</head>
<body>
<div class="boot" id="boot" role="status" aria-live="polite">
  <div class="boot__card">
    <div class="boot__t">Temporally Evolving T1D Knowledge Graph</div>
    <div class="boot__s" id="bootmsg">Starting&hellip;</div>
    <div class="boot__track"><div class="boot__fill"></div></div>
    <div class="boot__n" id="bootn">no server: the queries run in this browser</div>
  </div>
</div>

<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.7.16/vue.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vuex/3.6.2/vuex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

<script src="src/lib/glyphs.js"></script>
<script src="src/lib/entityLinks.js"></script>
<script src="src/sql.js"></script>
<script src="src/api.js"></script>
<script src="src/cypher.js"></script>
<script src="src/store.js"></script>
<script src="src/components/SearchBox.js"></script>
<script src="src/components/FilterRail.js"></script>
<script src="src/seeds.js"></script>
<script src="src/components/GraphCanvas.js"></script>
<script src="src/components/EvidencePanel.js"></script>
<script src="src/components/InspectorPanel.js"></script>
<script src="src/components/ErrorBar.js"></script>
<script src="src/components/TimeStrip.js"></script>
<script src="src/components/CypherDrawer.js"></script>
<script src="src/assistant.js"></script>
<script src="src/components/AssistantPanel.js"></script>
<script src="src/App.js"></script>

<script>
// Nothing here should be able to fail quietly. An exception inside a store action
// is an unhandled rejection with no visible effect: the panels keep working and the
// canvas simply stays empty, which is exactly how this build first went wrong.
(() => {
  const show = what => {
    const box = document.getElementById("boot");
    const msg = document.getElementById("bootmsg");
    const num = document.getElementById("bootn");
    if (box && !box.isConnected) {          // already running: use a top strip
      let bar = document.getElementById("jsfail");
      if (!bar) {
        bar = document.createElement("div");
        bar.id = "jsfail";
        bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:400;"
          + "background:#9B3724;color:#fff;font:400 12px/1.4 var(--mono,monospace);"
          + "padding:7px 12px";
        document.body.appendChild(bar);
      }
      bar.textContent = "Something failed: " + what;
      return;
    }
    if (msg) {
      msg.className = "boot__s boot__err";
      msg.textContent = "The explorer could not start in this browser.";
    }
    if (num) num.textContent = what;
  };
  window.addEventListener("error", e => show(String(e.message || e.type)));
  window.addEventListener("unhandledrejection",
    e => show(String((e.reason && e.reason.message) || e.reason)));
})();

(async () => {
  const box = document.getElementById("boot");
  const msg = document.getElementById("bootmsg");
  const num = document.getElementById("bootn");
  try {
    await window.T1DBootDuck(t => { msg.textContent = t; });
    // Vue replaces #app with the component's root, so the overlay is a sibling of
    // #app rather than inside it.
    new Vue({ el: "#app", store: window.T1DStore,
              render: h => h(window.App) });

    // No seeding. The canvas opens on its own invitation - search, or pick one of
    // three entities - which teaches the interaction in a way a graph that is
    // already there does not. The overlay hands over to that, not to a blank
    // canvas, which is the distinction that matters here.
    msg.textContent = "Ready";
    num.textContent = "pick an entity to begin";
    box.classList.add("gone");
    setTimeout(() => box.remove(), 500);
  } catch (e) {
    msg.className = "boot__s boot__err";
    msg.textContent = "The explorer could not start in this browser.";
    num.textContent = String((e && e.message) || e);
    console.error(e);
  }
})();
</script>
</body>
</html>
